# Keeps this fork current with alibaba/AliSQL.
#
# master is upstream master plus the commits made in this fork. When upstream
# moves, master is rebased onto it. A patch that upstream has merged drops out
# of the rebase on its own. A conflict stops the sync and fails the run;
# rebase locally and push.
#
# SYNC_TOKEN is the fork owner's fine-grained token (Contents and Workflows:
# read/write on this repository). Upstream commits may touch .github/workflows,
# which GITHUB_TOKEN cannot push, and pushes made with GITHUB_TOKEN do not
# start the build.
name: Sync upstream

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Rebase master onto upstream
        run: |
          set -euo pipefail
          git config user.name "Stalin Solomon"
          git config user.email "4509346+stalingino@users.noreply.github.com"

          git remote add upstream https://github.com/alibaba/AliSQL.git
          git fetch --filter=blob:none upstream master

          upstream=$(git rev-parse upstream/master)
          base=$(git merge-base HEAD upstream/master)
          if [ "$base" = "$upstream" ]; then
            echo "Upstream unchanged at ${upstream:0:12}." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git rebase upstream/master; then
            {
              echo "master does not rebase cleanly onto upstream ${upstream:0:12}:"
              echo '```'
              git status --short | grep -E '^(UU|AA|DU|UD) ' || true
              echo '```'
              echo "Rebase it locally (git rebase upstream/master) and push."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            git rebase --abort
            exit 1
          fi

          git push --force-with-lease=master origin master
          {
            echo "Rebased onto upstream ${upstream:0:12} (was ${base:0:12}). Commits on top:"
            git log --format='- %h %s' upstream/master..master
          } >> "$GITHUB_STEP_SUMMARY"
