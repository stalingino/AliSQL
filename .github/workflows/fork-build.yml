# Builds master (upstream plus this fork's commits) with the same toolchain as upstream's
# build-and-release.yml (oraclelinux:7, devtoolset-10, glibc 2.17), runs the
# DuckDB test suite, and publishes the tarballs as a pre-release named after
# the commit. The last five builds are kept.
#
# Two packaging fixes on top of upstream's recipe, both in this file only:
# - OpenSSL is built from source and bundled in lib/private (WITH_SSL=<path>),
#   as in MySQL's own glibc 2.17 tarballs. Linking the build image's system
#   OpenSSL 1.0.2 made the binaries need libssl.so.10, which current
#   distributions no longer ship. ncurses 5, which the mysql client needs, is
#   bundled there too.
# - The embedded DuckDB gets its real platform and version. Without them it
#   reports platform '"linux"' and version v0.0.1, and refuses to load
#   extensions built for linux_amd64 / linux_arm64.
name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'wiki/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  # OpenSSL LTS release bundled in the tarballs.
  OPENSSL_VERSION: 3.5.9
  # patchelf, which MySQL's CMake requires to bundle OpenSSL (OL7 has none; EPEL's 0.9 lacks
  # --page-size, which CMake passes on aarch64). SHA-256 of the release's .tar.bz2.
  PATCHELF_VERSION: 0.18.0
  PATCHELF_SHA256: 1952b2a782ba576279c211ee942e341748fdb44997f704dd53def46cd055470b
  # DuckDB release vendored in extra/duckdb (src/storage/version_map.json). Bump with it.
  DUCKDB_VERSION: v1.4.4

concurrency:
  group: build-master
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build, test and package inside oraclelinux:7
        env:
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/AliSQL" \
            -v "$GITHUB_WORKSPACE/out:/out" \
            -e SHORT_SHA="${SHORT_SHA:0:7}" \
            -e OPENSSL_VERSION \
            -e PATCHELF_VERSION \
            -e PATCHELF_SHA256 \
            -e DUCKDB_VERSION \
            oraclelinux:7 \
            bash -ex <<'INNER'

          cat >/etc/yum.repos.d/ol7-scl.repo <<'REPO'
          [ol7_software_collections]
          name=Oracle Linux 7 Software Collections ($basearch)
          baseurl=https://yum.oracle.com/repo/OracleLinux/OL7/SoftwareCollections/$basearch/
          gpgcheck=1
          enabled=1
          gpgkey=https://yum.oracle.com/RPM-GPG-KEY-oracle-ol7
          REPO
          yum install -y -q git wget which bzip2 \
            devtoolset-10-gcc devtoolset-10-gcc-c++ devtoolset-10-binutils \
            openssl openssl-devel ncurses-devel libaio-devel perl-IPC-Cmd perl-Time-Piece bison \
            perl-Data-Dumper perl-Time-HiRes perl-JSON perl-Digest-MD5 perl-Env perl-Test-Simple

          cd /opt
          wget -q "https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-$(uname -m).tar.gz"
          tar -xzf cmake-3.28.6-linux-*.tar.gz
          export PATH="/opt/cmake-3.28.6-linux-$(uname -m)/bin:$PATH"

          set +u; source /opt/rh/devtoolset-10/enable; set -u

          # OpenSSL to bundle, built with the same compiler and glibc as the server.
          cd /tmp
          OSSL="openssl-${OPENSSL_VERSION}"
          wget -q "https://github.com/openssl/openssl/releases/download/${OSSL}/${OSSL}.tar.gz"
          wget -q "https://github.com/openssl/openssl/releases/download/${OSSL}/${OSSL}.tar.gz.sha256"
          echo "$(awk '{print $1}' "${OSSL}.tar.gz.sha256")  ${OSSL}.tar.gz" | sha256sum -c -
          tar -xzf "${OSSL}.tar.gz"
          (cd "${OSSL}" && ./Configure --prefix=/opt/openssl --libdir=lib shared no-tests no-docs \
            && make -s -j"$(nproc)" && make -s install_sw)
          PE="patchelf-${PATCHELF_VERSION}"
          wget -q "https://github.com/NixOS/patchelf/releases/download/${PATCHELF_VERSION}/${PE}.tar.bz2"
          echo "${PATCHELF_SHA256}  ${PE}.tar.bz2" | sha256sum -c -
          tar -xjf "${PE}.tar.bz2"
          (cd "${PE}" && ./configure -q --prefix=/usr/local && make -s -j"$(nproc)" && make -s install)
          patchelf --version

          cd /AliSQL
          # Mark the build so SELECT VERSION() tells it apart from an upstream release.
          sed -i "s/^MYSQL_VERSION_EXTRA=.*/MYSQL_VERSION_EXTRA=-g${SHORT_SHA}/" MYSQL_VERSION
          # Same cap as upstream so the DuckDB build fits a hosted runner.
          export MAX_JOBS="$(nproc)"
          sed -i -E "s#(^[[:space:]]*cmake --build \\. --config Release -j) .+#\\1 ${MAX_JOBS}#" extra/duckdb/Makefile
          # Link the OpenSSL built above: MySQL's CMake then installs it in lib/private and sets
          # RPATH $ORIGIN/../lib/private on the binaries. build.sh has no option for it.
          grep -q '^    -DMYSQL_SERVER_SUFFIX="$server_suffix"$' build.sh
          sed -i 's#^    -DMYSQL_SERVER_SUFFIX="$server_suffix"$#&\n    -DWITH_SSL=/opt/openssl#' build.sh
          grep -q '^    -DWITH_SSL=/opt/openssl$' build.sh
          # extra/duckdb/Makefile passes these to DuckDB's CMake (DUCKDB_EXPLICIT_PLATFORM,
          # OVERRIDE_GIT_DESCRIBE). The tree has no DuckDB git tags to derive them from.
          case "$(uname -m)" in x86_64) DUCKDB_ARCH=amd64 ;; aarch64) DUCKDB_ARCH=arm64 ;; esac
          export DUCKDB_PLATFORM="linux_${DUCKDB_ARCH}"
          export OVERRIDE_GIT_DESCRIBE="${DUCKDB_VERSION}"

          sh build.sh -t release -d /opt/alisql
          make install

          # The mysql client links ncurses 5, which current distributions no longer ship.
          cp -a /usr/lib64/libncurses.so.5* /usr/lib64/libtinfo.so.5* /opt/alisql/lib/private/

          # The tarball must not depend on the build image's OpenSSL, and its binaries must
          # find lib/private.
          ls /opt/alisql/lib/private/libssl.so.3 /opt/alisql/lib/private/libcrypto.so.3
          for bin in mysqld mysql mysqldump mysqladmin; do
            if readelf -d "/opt/alisql/bin/$bin" | grep -E 'NEEDED.*lib(ssl|crypto)\.so\.10'; then exit 1; fi
            readelf -d "/opt/alisql/bin/$bin" | grep -E 'R(UN)?PATH.*\$ORIGIN/\.\./lib/private'
          done

          # mysqld refuses to run as root; the suite runs as an unprivileged user,
          # which also writes component configs next to the built plugins.
          useradd -m mtr
          chown -R mtr /AliSQL
          # Inside a container DuckDB reads cgroup memory.max = "max" as 0 bytes and
          # every query fails with Out of Memory, so give it an explicit limit.
          # Skipped, failing on unpatched upstream in this setup as well:
          #   duckdb_config     expects the default duckdb_memory_limit
          #   system_timezone   restarts mysqld via mysqld_safe without the limit
          #   duckdb_agg_func   last digit of a STD/STDDEV double differs
          #   list_partition    intermittent: Parser Error sometimes carries LINE context
          #   range_partition   same as list_partition
          su mtr -c "cd /AliSQL/mysql-test && ./mtr --suite=duckdb --parallel=$(nproc) --force --retry=0 \
            --max-test-fail=0 --testcase-timeout=15 --mysqld=--duckdb_memory_limit=2147483648 \
            '--skip-test=^(duckdb_config|system_timezone|duckdb_agg_func|list_partition|range_partition)$' \
            main.mysqld--help-notwin sys_vars.all_vars"

          # The installed server's DuckDB reports the real platform and version.
          cat >/tmp/duckdb-identity.sh <<'CHECK'
          set -eux
          D=$(mktemp -d)
          M="/opt/alisql/bin/mysql -uroot -S $D/mysql.sock -N -e"
          /opt/alisql/bin/mysqld --no-defaults --basedir=/opt/alisql --datadir="$D/data" --initialize-insecure
          /opt/alisql/bin/mysqld --no-defaults --basedir=/opt/alisql --datadir="$D/data" --socket="$D/mysql.sock" \
            --skip-networking --skip-mysqlx --duckdb_mode=ON --duckdb_memory_limit=2147483648 &
          for i in $(seq 120); do /opt/alisql/bin/mysqladmin -uroot -S "$D/mysql.sock" ping && break; sleep 1; done
          platform=$($M "CALL dbms_duckdb.query('PRAGMA platform')")
          version=$($M "CALL dbms_duckdb.query('SELECT version()')")
          echo "$platform" | grep -q "linux_$1"
          echo "$version" | grep -q "$2"
          /opt/alisql/bin/mysqladmin -uroot -S "$D/mysql.sock" shutdown
          CHECK
          su mtr -c "bash /tmp/duckdb-identity.sh ${DUCKDB_ARCH} ${DUCKDB_VERSION}"

          VER="8.0.44-g${SHORT_SHA}"
          PKG="alisql-${VER}-linux-glibc$(ldd --version | awk 'NR==1{print $NF}')-$(uname -m).tar.xz"
          TOPDIR="${PKG%.tar.xz}"
          cd /opt
          XZ_OPT='-T0 -9' tar -cJf "/out/${PKG}" \
            --transform="s,^alisql,${TOPDIR}," \
            --exclude='alisql/mysql-test' \
            --exclude='alisql/run' \
            --exclude='alisql/var' \
            --exclude='alisql/LICENSE-test' \
            --exclude='alisql/LICENSE.router' \
            --exclude='alisql/README-test' \
            --exclude='alisql/README.router' \
            --exclude='alisql/mysqlrouter-log-rotate' \
            alisql/
          ls -lh "/out/${PKG}"
          INNER

      - uses: actions/upload-artifact@v4
        with:
          name: alisql-${{ matrix.arch }}
          path: ${{ github.workspace }}/out/alisql-*.tar.xz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --filter=blob:none https://github.com/alibaba/AliSQL.git master
          UPSTREAM=$(git rev-parse FETCH_HEAD)
          SHORT="${GITHUB_SHA:0:7}"
          TAG="build-${SHORT}"
          NOTES="${RUNNER_TEMP}/notes.md"
          {
            echo "AliSQL built from \`master\` at ${GITHUB_SHA}: upstream master ${UPSTREAM:0:7} plus"
            echo
            git log --format='- %h %s' "$UPSTREAM..HEAD"
            echo
            echo "Same toolchain as the upstream release build (oraclelinux:7, devtoolset-10, glibc 2.17)."
            echo "OpenSSL ${OPENSSL_VERSION} and ncurses 5 are bundled in lib/private; DuckDB reports ${DUCKDB_VERSION}."
            echo "The DuckDB test suite passed on both architectures."
          } > "$NOTES"

          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "AliSQL 8.0.44-g${SHORT}" --notes-file "$NOTES" artifacts/alisql-*.tar.xz

          # Keep the five newest builds.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
